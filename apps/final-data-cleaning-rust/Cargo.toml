[package]
name = "probe-x-final-cleaning-rust"
version = "0.1.0"
description = "Independent Rust final-cleaning compute node for Probe-X"
license = "MIT"
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
flate2 = "1"
prost = "0.13"
rayon = "1.10"
redis = { version = "0.27", features = ["tokio-rustls-comp", "connection-manager", "cluster-async"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1

