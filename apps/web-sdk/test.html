<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probe-X Web SDK 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .log {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #007bff;
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Probe-X Web SDK 测试</h1>
    
    <button class="button" onclick="testTrack()">测试埋点</button>
    <button class="button" onclick="testUser()">设置用户</button>
    <button class="button" onclick="clearLog()">清空日志</button>
    
    <div id="log" class="log"></div>
    
    <!-- 引入SDK -->
    <script src="../../dist/apps/web-sdk/probe-x-sdk.js"></script>
    
    <script>
        // 初始化SDK
        const probeX = new ProbeX({
            apiUrl: 'http://localhost:3000/data/beacon',
            appId: 'test-app',
            debug: true,
            autoTrack: true,
            batchSize: 1,
            flushInterval: 2000,
        });
        
        // 监听SDK事件
        window.addEventListener('probe-x-event', function(event) {
            logEvent('SDK Event', event.detail);
        });
        
        // 测试埋点
        function testTrack() {
            probeX.track('test_event', {
                test_property: 'test_value',
                timestamp: Date.now(),
            });
            logEvent('手动埋点', { event: 'test_event' });
        }
        
        // 设置用户
        function testUser() {
            probeX.setUser({
                user_id: 'test_user_123',
                user_name: '测试用户',
            });
            logEvent('用户设置', { user_id: 'test_user_123' });
        }
        
        // 日志记录
        function logEvent(type, data) {
            const log = document.getElementById('log');
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <strong>${type}</strong> - ${new Date().toLocaleTimeString()}<br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            log.insertBefore(logItem, log.firstChild);
        }
        
        // 清空日志
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // 页面加载完成
        window.addEventListener('load', function() {
            logEvent('页面加载完成', { url: window.location.href });
        });
    </script>
</body>
</html>
