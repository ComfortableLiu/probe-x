syntax = "proto3";

package final_data_cleaning_control_bi_stream;

// 计算任务指令
message ComputeTask {
    // 任务唯一标识
    string task_id = 1;
    // 需要计算的 SessionId，未来支持线程池复用后可以传个数组
    string session_id = 2;
    // 需要计算的日期，格式为 YYYY-MM-DD
    string date = 3;
}

// 进度更新指令
message ProgressUpdate {
    // 关联的任务ID
    string task_id = 1;
    // 目标进度
    int32 target = 2;
    // 总进度
    int32 progress = 3;
    // 节点唯一标识
    string node_id = 4;
    // 附加信息（如“正在处理第3个分片”）
    string message = 5;
    // 是否完成
    bool completed = 6;
    // 是否失败
    bool failed = 7;
    // 失败信息
    string error = 8;
}

// 节点信息
message NodeInfo {
    // cpu核心数
    int32 cpu_count = 1;
    // 总内存大小，MB单位
    int32 memory_size = 2;
    // 可用内存大小，MB单位
    int32 available_memory_size = 3;
    // 是否可用
    bool available = 4;
    // 是否忙碌中
    bool busy = 5;
    // 忙碌任务id
    string busy_task_id = 6;
}

// 节点注册/心跳指令：连上总服务时必发一次，之后周期性重发兼作心跳
message NodeRegister {
    // 节点唯一标识
    string node_id = 1;
    // 节点名称（展示用，便于在页面上辨认）
    string node_name = 2;
    // 节点上报的自身地址（可选，仅用于排查，不作为连通性依据）
    string node_address = 3;
    // 节点版本号
    string version = 4;
    // 节点资源与运行状态
    NodeInfo info = 5;
}

// 总服务应答：对注册帧的确认
message MasterAck {
    // 是否接受该节点接入
    bool accepted = 1;
    // 附带信息（如拒绝原因）
    string message = 2;
}

// 节点 -> 总服务 上行帧
message NodeFrame {
    oneof payload {
        // 注册/心跳
        NodeRegister register = 1;
        // 任务进度
        ProgressUpdate progress = 2;
    }
}

// 总服务 -> 节点 下行帧
message MasterFrame {
    oneof payload {
        // 注册应答
        MasterAck ack = 1;
        // 下发计算任务
        ComputeTask task = 2;
    }
}

// 计算节点接入总服务：节点作为客户端拨出连接，上行注册/心跳/进度，下行任务/控制指令
service NodeControlService {
    rpc Connect (stream NodeFrame) returns (stream MasterFrame);
}
